[project]
name = "cernal"
version = "0.1.0"
description = "CERNAL — RNA logic circuit design platform (iGEM)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "iGEM TAU 2026 Team, Tel Aviv University" }]
keywords = ["synthetic-biology", "rna", "logic-circuits", "transcriptomics", "igem"]
dependencies = [
    "django>=5.2,<6.0",
    "django-ninja>=1.3",
    "django-q2>=1.7",
    "django-environ>=0.11",
    "openpyxl>=3.1",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "viennarna>=2.7.2",
    "biopython>=1.85",
    # SBOL 3 export, confined to stages/plasmids.py (ADR 0008) exactly as biopython is
    # by ADR 0007. sbol-utilities is deliberately NOT used: its GenBank converter calls
    # SeqFeature.strand, removed in the biopython above, and it costs 36 packages.
    "sbol3>=1.2",
    # Evolutionary-stability repair of coding sequences (replication slippage,
    # recombination-mediated deletion, methylation motifs), confined to
    # gates/tools/codons.py exactly as sbol3 is to stages/plasmids.py. Pinned EXACTLY:
    # 0.1.2 is the release whose API was measured (suspect_site_extractor takes num_sites
    # positionally; the GitHub README documents modules that this wheel does not ship),
    # and it is stochastic, so a drifting version changes results with no code change.
    "evolutionary-stability-optimizer==0.1.2",
    # Imported directly by gates/tools/codons.py, which also reads them through ESO's own
    # dependency tree — declared here so a change in that tree cannot silently remove
    # them. The codon-usage tables decide every CAI this engine reports, so they are
    # pinned exactly like ESO; numpy is imported only to seed DNAChisel's global generator
    # (ESO draws from numpy.random as well as random — see codons._deterministic).
    "python-codon-tables==0.1.18",
    "numpy>=2.0",
    # Platform-side only: apps/expression's provider adapters, run offline by
    # manage.py sync_expression_catalog. Never imported by src/engine/.
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "matplotlib>=3.11.2",
    "ipykernel>=6.29",
    "playwright>=1.47",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# vendor/ is third-party code used as an unmodified git submodule (docs/collaborations.md):
# it is never linted, reformatted or lint-fixed, because the collaboration requires that
# not one byte of it differs from the upstream commit pinned in .gitmodules.
extend-exclude = ["**/migrations/*", "frontend", "var", "vendor"]

# The notebook formatter rewrites each cell's "source" from a single JSON string into a
# list of lines and renormalises quotes. That is pure churn on a file type the team edits
# in Jupyter, and it conflicts hard when two people touch the same notebook. `ruff check`
# still runs on them — only the formatter is held back.
[tool.ruff.format]
exclude = ["src/engine/gates/notebooks/**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "RUF"]
ignore = [
    "RUF012",  # Django class attrs (Meta, list_display) are not ClassVar-annotated by convention
]

[tool.ruff.lint.per-file-ignores]
# django-ninja declares request parsing via callables in argument defaults
# (File(...), Form(...), Query(...)) — the same dependency-injection idiom FastAPI uses.
# B008 exists to catch mutable defaults, which these are not.
"src/api/routers/*.py" = ["B008"]

# The gate notebooks open with a bootstrap cell that puts `_fixtures.py` on sys.path
# before importing it. That import cannot move to the top of the cell — the path it
# needs does not exist yet — and isort reordering it would break the notebook outright.
# E401 covers the `import sys, pathlib` line the same cell opens with. E501: an
# HTML-report-generating cell embeds an actual HTML/CSS template as an f-string —
# wrapping every attribute onto its own line to fit 100 columns would make that
# template harder to read, not easier, for no benefit outside this file type.
"src/engine/gates/notebooks/**/*.ipynb" = ["E401", "E402", "I001", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps", "api", "engine"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
# --ignore=vendor: the submodule carries its own tests (Flask, Python 3.12). They are
# upstream's to run, not ours. testpaths already keeps them out; this keeps `pytest .` out too.
addopts = "-ra --strict-markers --ignore=vendor"
