[project]
name = "cernal"
version = "0.1.0"
description = "CERNAL — RNA logic circuit design platform (iGEM)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "iGEM TAU 2026 Team, Tel Aviv University" }]
keywords = ["synthetic-biology", "rna", "logic-circuits", "transcriptomics", "igem"]
dependencies = [
    "django>=5.2,<6.0",
    "django-ninja>=1.3",
    "django-q2>=1.7",
    "django-environ>=0.11",
    "openpyxl>=3.1",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "viennarna>=2.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["**/migrations/*", "frontend", "var"]

# The notebook formatter rewrites each cell's "source" from a single JSON string into a
# list of lines and renormalises quotes. That is pure churn on a file type the team edits
# in Jupyter, and it conflicts hard when two people touch the same notebook. `ruff check`
# still runs on them — only the formatter is held back.
[tool.ruff.format]
exclude = ["src/engine/gates/notebooks/**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "RUF"]
ignore = [
    "RUF012",  # Django class attrs (Meta, list_display) are not ClassVar-annotated by convention
]

[tool.ruff.lint.per-file-ignores]
# django-ninja declares request parsing via callables in argument defaults
# (File(...), Form(...), Query(...)) — the same dependency-injection idiom FastAPI uses.
# B008 exists to catch mutable defaults, which these are not.
"src/api/routers/*.py" = ["B008"]

# The gate notebooks open with a bootstrap cell that puts `_fixtures.py` on sys.path
# before importing it. That import cannot move to the top of the cell — the path it
# needs does not exist yet — and isort reordering it would break the notebook outright.
# E401 covers the `import sys, pathlib` line the same cell opens with.
"src/engine/gates/notebooks/**/*.ipynb" = ["E401", "E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps", "api", "engine"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
