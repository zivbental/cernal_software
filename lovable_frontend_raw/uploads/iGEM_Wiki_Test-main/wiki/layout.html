<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}iGEM Wiki{% endblock %}</title>
    <meta name="description" content="Official iGEM wiki for CERNAL">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Styles & Scripts -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <div class="bg-animation"></div>

    <!-- Global Menu -->
    {% include 'menu.html' %}

    <main>
        <div class="wiki-page container">
            <!-- Sidebar: auto-populated by app.js, hidden when empty -->
            <aside class="wiki-sidebar" id="wikiSidebar">
                <span class="wiki-sidebar__title">Contents</span>
                <ul class="wiki-sidebar__list" id="wikiSidebarList"></ul>
            </aside>

            <!-- Page content injected by child templates -->
            <div class="wiki-main" id="wikiMain">
                {% block page_content %}{% endblock %}
            </div>
        </div>
    </main>

    <!-- Global Footer -->
    {% include 'footer.html' %}
</body>
</html>
