<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CERNAL product and software overview</title>
  <desc id="desc">A researcher uses either the React browser application or Python, R, MATLAB, and curl clients. Both reach the Django Ninja API, database, ORM queue, and single worker. The worker calls the EngineClient boundary, which selects MockEngine or LocalEngine. LocalEngine uses ViennaRNA, the Biopython GenBank adapter, and a run output directory. The worker also writes database state and authorized artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31546f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .grid { stroke: #dce6ee; stroke-width: 1; }
      .title { font: 700 36px Inter, "Segoe UI", Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 18px Inter, "Segoe UI", Arial, sans-serif; fill: #526777; }
      .group-label { font: 700 15px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 1.5px; fill: #526777; }
      .node-title { font: 700 19px Inter, "Segoe UI", Arial, sans-serif; fill: #17324d; }
      .node-text { font: 400 15px Inter, "Segoe UI", Arial, sans-serif; fill: #405767; }
      .small { font: 600 13px Inter, "Segoe UI", Arial, sans-serif; fill: #526777; }
      .group { fill: #ffffff; stroke: #c8d6e0; stroke-width: 2; }
      .access { fill: #eef5ff; stroke: #2f6bff; stroke-width: 2; }
      .platform { fill: #edf8f7; stroke: #0f766e; stroke-width: 2; }
      .engine { fill: #f5f0ff; stroke: #6d28d9; stroke-width: 2; }
      .storage { fill: #fff8e8; stroke: #b45309; stroke-width: 2; }
      .external { fill: #f4f6f8; stroke: #64748b; stroke-width: 2; }
      .connector { fill: none; stroke: #31546f; stroke-width: 3; marker-end: url(#arrow); }
      .connector-dashed { fill: none; stroke: #6d28d9; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .boundary { fill: #fdfefe; stroke: #9fb1bf; stroke-width: 2; stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <path class="grid" opacity="0.35" d="M40 110H1560 M40 540H1560 M580 110V850"/>

  <g id="header">
    <text class="title" x="60" y="62">CERNAL product and software overview</text>
    <text class="subtitle" x="60" y="94">One product surface, a stable engine boundary, and two selectable execution paths</text>
  </g>

  <g id="boundaries">
    <rect class="group" x="40" y="130" width="520" height="380" rx="24"/>
    <text class="group-label" x="66" y="162">ACCESS</text>
    <rect class="group" x="590" y="130" width="970" height="380" rx="24"/>
    <text class="group-label" x="616" y="162">WEB PLATFORM AND WORKER</text>
    <rect class="boundary" x="590" y="550" width="970" height="300" rx="24"/>
    <text class="group-label" x="616" y="582">ENGINE BOUNDARY AND SCIENTIFIC EXECUTION</text>
  </g>

  <g id="connections">
    <path class="connector" d="M250 318 C280 318 280 245 310 245"/>
    <path class="connector" d="M250 342 C280 342 280 425 310 425"/>
    <path class="connector" d="M530 245 C575 245 585 274 630 274"/>
    <path class="connector" d="M530 425 C575 425 585 326 630 326"/>
    <path class="connector" d="M870 272 C905 272 910 225 945 225"/>
    <path class="connector" d="M870 322 C905 322 910 385 945 385"/>
    <path class="connector" d="M1165 385 H1215"/>
    <path class="connector" d="M1330 335 C1330 280 1195 250 1165 250"/>
    <path class="connector" d="M1330 435 V455"/>
    <path class="connector" d="M1445 410H1515V535H1180V680H880"/>
    <path class="connector" d="M880 670 C905 670 910 625 935 625"/>
    <path class="connector" d="M880 690 C905 690 910 755 935 755"/>
    <path class="connector-dashed" d="M1155 745 C1185 745 1185 625 1215 625"/>
    <path class="connector-dashed" d="M1155 755 H1215"/>
    <path class="connector-dashed" d="M1155 770 C1185 770 1185 805 1215 805"/>
  </g>

  <g id="access-nodes" filter="url(#shadow)">
    <rect class="access" x="70" y="270" width="180" height="110" rx="16"/>
    <circle cx="112" cy="310" r="18" fill="#2f6bff" opacity="0.18"/>
    <circle cx="112" cy="303" r="7" fill="#2f6bff"/>
    <path d="M96 333 Q112 317 128 333" fill="none" stroke="#2f6bff" stroke-width="5" stroke-linecap="round"/>
    <text class="node-title" x="145" y="315">Researcher</text>
    <text class="node-text" x="94" y="358">Submits and reviews</text>

    <rect class="access" x="310" y="190" width="220" height="110" rx="16"/>
    <text class="node-title" x="334" y="232">React browser</text>
    <text class="node-text" x="334" y="259">application</text>
    <text class="small" x="334" y="282">Interactive product UI</text>

    <rect class="access" x="310" y="370" width="220" height="110" rx="16"/>
    <text class="node-title" x="334" y="408">Automation clients</text>
    <text class="node-text" x="334" y="437">Python · R · MATLAB</text>
    <text class="small" x="334" y="461">curl / generic HTTP</text>
  </g>

  <g id="platform-nodes" filter="url(#shadow)">
    <rect class="platform" x="630" y="235" width="240" height="110" rx="16"/>
    <text class="node-title" x="654" y="278">Django Ninja API</text>
    <text class="node-text" x="654" y="307">Validation and HTTP surface</text>
    <text class="small" x="654" y="329">Session or API-key access</text>

    <rect class="storage" x="945" y="180" width="220" height="100" rx="16"/>
    <text class="node-title" x="969" y="222">Database</text>
    <text class="node-text" x="969" y="249">SQLite or configured DB</text>
    <text class="small" x="969" y="270">Runs · results · metadata</text>

    <rect class="platform" x="945" y="340" width="220" height="90" rx="16"/>
    <text class="node-title" x="969" y="378">django-q2</text>
    <text class="node-text" x="969" y="406">ORM-backed queue</text>

    <rect class="platform" x="1215" y="285" width="230" height="150" rx="16"/>
    <text class="node-title" x="1239" y="330">Single worker</text>
    <text class="node-text" x="1239" y="359">Executes queued runs</text>
    <text class="small" x="1239" y="387">Persists lifecycle state</text>
    <text class="small" x="1239" y="409">Calls the engine client</text>

    <rect class="storage" x="1215" y="455" width="230" height="45" rx="13"/>
    <text class="small" x="1239" y="483">Authorized artifact storage</text>
  </g>

  <g id="engine-nodes" filter="url(#shadow)">
    <rect class="engine" x="630" y="630" width="250" height="90" rx="16"/>
    <text class="node-title" x="654" y="669">EngineClient boundary</text>
    <text class="node-text" x="654" y="697">Stable selectable interface</text>

    <rect class="external" x="935" y="585" width="220" height="80" rx="16"/>
    <text class="node-title" x="959" y="621">MockEngine</text>
    <text class="node-text" x="959" y="647">Deterministic simulation</text>

    <rect class="engine" x="935" y="705" width="220" height="90" rx="16"/>
    <text class="node-title" x="959" y="744">LocalEngine</text>
    <text class="node-text" x="959" y="772">Implemented scientific path</text>

    <rect class="external" x="1215" y="590" width="285" height="70" rx="16"/>
    <text class="node-title" x="1239" y="623">ViennaRNA</text>
    <text class="node-text" x="1239" y="647">Structure thermodynamics</text>

    <rect class="external" x="1215" y="720" width="285" height="70" rx="16"/>
    <text class="node-title" x="1239" y="753">Biopython</text>
    <text class="node-text" x="1239" y="777">GenBank adapter</text>

    <rect class="storage" x="1215" y="800" width="285" height="38" rx="12"/>
    <text class="small" x="1239" y="825">Run output directory</text>
  </g>

  <g id="legend">
    <rect x="60" y="798" width="470" height="42" rx="12" fill="#ffffff" stroke="#c8d6e0"/>
    <circle cx="88" cy="819" r="7" fill="#2f6bff"/>
    <text class="small" x="104" y="824">Access</text>
    <circle cx="178" cy="819" r="7" fill="#0f766e"/>
    <text class="small" x="194" y="824">Platform</text>
    <circle cx="284" cy="819" r="7" fill="#6d28d9"/>
    <text class="small" x="300" y="824">Engine</text>
    <circle cx="378" cy="819" r="7" fill="#b45309"/>
    <text class="small" x="394" y="824">Storage</text>
    <text class="small" x="60" y="873">Dashed arrows mark LocalEngine scientific dependencies and output.</text>
  </g>
</svg>
